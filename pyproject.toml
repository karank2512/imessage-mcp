[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imessage-mcp"
version = "0.1.0"
description = "MCP server for iMessage through BlueBubbles: read threads, send to an allowlist, health checks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
imessage-mcp = "imessage_mcp.server:main"

[tool.setuptools]
packages = ["imessage_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
